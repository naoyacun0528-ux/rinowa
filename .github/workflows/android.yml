name: Android

# iOS 側は毎回 CI が回っているのに、Android は何も回っていなかった。
# 手元で通ることと、他の環境で通ることは別。
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  # 同じ枝で新しく押されたら、古いほうは止める。順番待ちに意味がない。
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 組み立てて試す
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: JDK を置く
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle を用意する
        uses: gradle/actions/setup-gradle@v4
        with:
          # 同じ依存を毎回取りに行かない。main の分だけ書き込む。
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Firebase の設定に、CI 用の偽物を置く
        # **本物は置かない。** リポジトリは公開してあるし、置く理由も無い。
        #
        # ただし何も置かないとビルドが通らない。Google Services プラグインが
        # google-services.json から R.string.default_web_client_id を作っていて、
        # auth/GoogleCredentialClient.kt がそれを参照しているため。
        # 「設定が無ければプラグインを飛ばす」だけでは、参照側が残る。
        #
        # ここで作るのは形だけ揃えた偽物で、この APK は Firebase に繋がらない。
        # 確かめたいのは**コードが組み上がること**であって、通信ではない。
        run: |
          cat > android/app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "rinowa-ci-placeholder",
              "storage_bucket": "rinowa-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": { "package_name": "blog.nextlab.echo" }
                },
                "oauth_client": [
                  { "client_id": "000000000000-ci.apps.googleusercontent.com", "client_type": 3 }
                ],
                "api_key": [ { "current_key": "NOT_A_REAL_KEY_0000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              },
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:1111111111111111111111",
                  "android_client_info": { "package_name": "blog.nextlab.echo.debug" }
                },
                "oauth_client": [
                  { "client_id": "000000000000-ci.apps.googleusercontent.com", "client_type": 3 }
                ],
                "api_key": [ { "current_key": "NOT_A_REAL_KEY_0000000000000000000000" } ],
                "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          echo "偽物を置いた（Firebase には繋がらない）"

      - name: 組み立てる
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain --stacktrace

      - name: 試す
        working-directory: android
        run: ./gradlew test --console=plain

      - name: 落ちた試験の記録を持ち帰る
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/**/build/reports/tests/
            android/**/build/test-results/
          if-no-files-found: ignore

      - name: できた APK を持ち帰る
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

# ------------------------------------------------------------------ この先
#
# 端末の要る試験（androidTest）は、まだ1つも無い。
# 書いたらここにもう1つ job を足す:
#
#   emulator:
#     runs-on: ubuntu-latest        ← KVM が使えるのは Linux ランナーだけ
#     steps:
#       - uses: reactivecircus/android-emulator-runner@v2
#         with:
#           api-level: 34
#           target: google_apis      ← Firebase を使うので GMS 入りが要る
#           arch: x86_64
#           script: ./gradlew connectedDebugAndroidTest
#
# **手元の Surface は Snapdragon X（ARM64）で、Android のエミュレータは
# Windows/ARM64 向けに配られていない**（`sdkmanager --install emulator` が
# "Failed to find package" を返す）。つまり手元では動かせないものを、
# ここでなら動かせる。E2EE の複数端末の検証はここへ持ってくる。
